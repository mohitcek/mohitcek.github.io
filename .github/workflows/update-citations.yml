name: Update live stats

on:
  schedule:
    - cron: "0 6 * * 1" # every Monday 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install scholarly
        run: pip install scholarly

      - name: Update stats.json
        run: |
          python - <<'EOF'
          import json, datetime, re, urllib.parse, urllib.request

          UA = {"User-Agent": "Mozilla/5.0 (stats-updater; mohitcek.github.io)"}
          PKGS = ["uqlm", "langfair", "uqpy"]

          def get(url, timeout=60):
              req = urllib.request.Request(url, headers=UA)
              return urllib.request.urlopen(req, timeout=timeout).read().decode()

          with open("stats.json") as f:
              stats = json.load(f)
          dl = stats.setdefault("downloads", {})

          # ── Source 1: ClickPy public ClickHouse (all-time, exact) — GET ──
          try:
              q = ("SELECT project, sum(count) AS total FROM pypi.pypi_downloads "
                   "WHERE project IN ('uqlm','langfair','uqpy') "
                   "GROUP BY project FORMAT JSON")
              url = ("https://clickpy-clickhouse.clickhouse.com/?user=play&query="
                     + urllib.parse.quote(q))
              data = json.loads(get(url))
              for row in data.get("data", []):
                  n = int(row["total"])
                  if n > 0:
                      dl[row["project"]] = n
              print("ClickPy downloads:", dl)
          except Exception as e:
              print(f"ClickPy fetch failed: {e}")

          # ── Source 2 (fallback): pepy.tech badge (all-time, rounded) ──
          MULT = {"": 1, "k": 1_000, "M": 1_000_000}
          for pkg in PKGS:
              if dl.get(pkg, 0) > 0:
                  continue
              try:
                  svg = get(f"https://static.pepy.tech/badge/{pkg}")
                  for txt in re.findall(r">([^<>]+)</text>", svg):
                      m = re.fullmatch(r"([\d.]+)\s*([kM]?)", txt.strip())
                      if m:
                          dl[pkg] = int(float(m.group(1)) * MULT[m.group(2)])
                          break
                  print(f"pepy {pkg}:", dl.get(pkg))
              except Exception as e:
                  print(f"pepy fetch failed for {pkg}: {e}")

          # ── Google Scholar citations ──
          try:
              from scholarly import scholarly
              author = scholarly.search_author_id("U70XbZoAAAAJ")
              author = scholarly.fill(author, sections=["basics", "indices"])
              citations = author.get("citedby")
              if citations:
                  stats["citations"] = citations
              print("Citations:", citations)
          except Exception as e:
              print(f"Scholar fetch failed, keeping old value: {e}")

          stats["updated"] = datetime.date.today().isoformat()
          with open("stats.json", "w") as f:
              json.dump(stats, f, indent=2)
          EOF

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats.json
          git diff --cached --quiet || (git commit -m "chore: update live stats" && git push)
