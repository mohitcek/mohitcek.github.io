name: Update live stats

on:
  schedule:
    - cron: "0 6 * * 1" # every Monday 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install scholarly
        run: pip install scholarly

      - name: Update stats.json
        run: |
          python - <<'EOF'
          import json, datetime, re, urllib.request

          UA = {"User-Agent": "Mozilla/5.0 (stats-updater; mohitcek.github.io)"}
          PKGS = ["uqlm", "langfair", "uqpy"]

          def get(url, timeout=60):
              req = urllib.request.Request(url, headers=UA)
              return urllib.request.urlopen(req, timeout=timeout).read().decode()

          with open("stats.json") as f:
              stats = json.load(f)
          dl = stats.setdefault("downloads", {})
          refreshed = []

          # ── Downloads: pepy.tech badge (all-time, rounded). Refresh every run;
          #    keep the previous value only when the fetch itself fails. ──
          MULT = {"": 1, "k": 1_000, "M": 1_000_000}
          for pkg in PKGS:
              try:
                  svg = get(f"https://static.pepy.tech/badge/{pkg}")
                  for txt in re.findall(r">([^<>]+)</text>", svg):
                      m = re.fullmatch(r"([\d.]+)\s*([kM]?)", txt.strip())
                      if m:
                          n = int(float(m.group(1)) * MULT[m.group(2)])
                          if n > 0:
                              dl[pkg] = n
                              refreshed.append("downloads." + pkg)
                          break
              except Exception as e:
                  print(f"::warning::pepy fetch failed for {pkg}: {e}")

          # ── Citations: public Scholar profile first, scholarly as fallback ──
          cites = None
          try:
              page = get("https://scholar.google.com/citations?hl=en&user=U70XbZoAAAAJ")
              vals = re.findall(r'class="gsc_rsb_std">(\d+)<', page)
              if vals:
                  cites = int(vals[0])
          except Exception as e:
              print(f"Scholar page fetch failed: {e}")
          if cites is None:
              try:
                  from scholarly import scholarly
                  author = scholarly.fill(scholarly.search_author_id("U70XbZoAAAAJ"),
                                          sections=["basics", "indices"])
                  cites = author.get("citedby")
              except Exception as e:
                  print(f"scholarly fetch failed: {e}")
          if cites:
              stats["citations"] = cites
              refreshed.append("citations")
          else:
              print(f"::warning::Citations not refreshed; keeping {stats.get('citations')}")

          print("Refreshed:", refreshed or "nothing")
          if refreshed:
              stats["updated"] = datetime.date.today().isoformat()
          with open("stats.json", "w") as f:
              json.dump(stats, f, indent=2)
              f.write("\n")
          EOF

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats.json
          git diff --cached --quiet || (git commit -m "chore: update live stats" && git push)
